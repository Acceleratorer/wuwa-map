name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wuwa-map-production
  cancel-in-progress: false

env:
  PNPM_VERSION: 11.9.0
  NODE_VERSION: 24
  REMOTE_DIR: /domains/accel.io.vn/public_html/wuwa-map

jobs:
  quality:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests and production build
        run: pnpm test

      - name: Save production bundle
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: wuwa-map-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy production
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download production bundle
        uses: actions/download-artifact@v4
        with:
          name: wuwa-map-dist-${{ github.sha }}
          path: dist

      - name: Create deployment archive
        run: (cd dist && zip -qr "../wuwa-map-${GITHUB_SHA}.zip" .)

      - name: Prepare DirectAdmin CA bundle
        env:
          DIRECTADMIN_CA_BUNDLE: ${{ secrets.DIRECTADMIN_CA_BUNDLE }}
        run: |
          set -euo pipefail
          test -n "${DIRECTADMIN_CA_BUNDLE}"
          printf '%s\n' "${DIRECTADMIN_CA_BUNDLE}" > "${RUNNER_TEMP}/directadmin-ca-bundle.pem"
          chmod 600 "${RUNNER_TEMP}/directadmin-ca-bundle.pem"

      - name: Deploy release with automatic rollback
        env:
          DIRECTADMIN_HOST: ${{ secrets.DIRECTADMIN_HOST }}
          DIRECTADMIN_USER: ${{ secrets.DIRECTADMIN_USER }}
          DIRECTADMIN_PASSWORD: ${{ secrets.DIRECTADMIN_PASSWORD }}
          DIRECTADMIN_CA_BUNDLE: ${{ secrets.DIRECTADMIN_CA_BUNDLE }}
        run: |
          set -euo pipefail
          bash tools/deploy-directadmin.sh
