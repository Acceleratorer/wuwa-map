name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wuwa-map-production
  cancel-in-progress: false

env:
  PNPM_VERSION: 11.9.0
  NODE_VERSION: 24
  REMOTE_DIR: /domains/accel.io.vn/public_html/wuwa-map

jobs:
  quality:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests and production build
        run: pnpm test

      - name: Save production bundle
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: wuwa-map-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy production
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download production bundle
        uses: actions/download-artifact@v4
        with:
          name: wuwa-map-dist-${{ github.sha }}
          path: dist

      - name: Create deployment archive
        run: (cd dist && zip -qr "../wuwa-map-${GITHUB_SHA}.zip" .)

      - name: Upload archive to DirectAdmin
        env:
          DIRECTADMIN_HOST: ${{ secrets.DIRECTADMIN_HOST }}
          DIRECTADMIN_USER: ${{ secrets.DIRECTADMIN_USER }}
          DIRECTADMIN_PASSWORD: ${{ secrets.DIRECTADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          archive="wuwa-map-${GITHUB_SHA}.zip"
          remote_dir_query="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["REMOTE_DIR"], safe=""))')"
          curl --fail-with-body --silent --show-error --insecure \
            --user "${DIRECTADMIN_USER}:${DIRECTADMIN_PASSWORD}" \
            --request POST \
            --form "file=@${archive};type=application/zip" \
            "https://${DIRECTADMIN_HOST}:2222/api/filemanager-actions/upload?dir=${remote_dir_query}&name=${archive}&perm=420&overwrite=true"

      - name: Extract deployment archive
        env:
          DIRECTADMIN_HOST: ${{ secrets.DIRECTADMIN_HOST }}
          DIRECTADMIN_USER: ${{ secrets.DIRECTADMIN_USER }}
          DIRECTADMIN_PASSWORD: ${{ secrets.DIRECTADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          payload="$(python3 - <<'PY'
          import json
          import os
          print(json.dumps({
              "source": f"{os.environ['REMOTE_DIR']}/wuwa-map-{os.environ['GITHUB_SHA']}.zip",
              "destinationDir": os.environ['REMOTE_DIR'],
              "members": [],
              "mergeAndOverwrite": True,
          }))
          PY
          )"
          curl --fail-with-body --silent --show-error --insecure \
            --user "${DIRECTADMIN_USER}:${DIRECTADMIN_PASSWORD}" \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "${payload}" \
            "https://${DIRECTADMIN_HOST}:2222/api/filemanager-actions/extract-archive"

      - name: Normalize directory permissions
        env:
          DIRECTADMIN_HOST: ${{ secrets.DIRECTADMIN_HOST }}
          DIRECTADMIN_USER: ${{ secrets.DIRECTADMIN_USER }}
          DIRECTADMIN_PASSWORD: ${{ secrets.DIRECTADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          remote_dir = Path(__import__('os').environ['REMOTE_DIR'])
          paths = [str(remote_dir)]
          paths.extend(
              str(remote_dir / path.relative_to('dist'))
              for path in sorted(Path('dist').rglob('*'))
              if path.is_dir()
          )
          for index in range(0, len(paths), 100):
              Path(f'/tmp/wuwa-map-chmod-{index}.json').write_text(
                  json.dumps({'paths': paths[index:index + 100], 'perm': 493}),
                  encoding='utf-8',
              )
          PY
          for payload in /tmp/wuwa-map-chmod-*.json; do
            curl --fail-with-body --silent --show-error --insecure \
              --user "${DIRECTADMIN_USER}:${DIRECTADMIN_PASSWORD}" \
              --request POST \
              --header 'Content-Type: application/json' \
              --data-binary "@${payload}" \
              "https://${DIRECTADMIN_HOST}:2222/api/filemanager-actions/chmod"
          done

      - name: Verify production
        run: |
          set -euo pipefail
          site='https://accel.io.vn/wuwa-map'
          curl --fail --silent --show-error "${site}/" | grep -Eq '/wuwa-map/assets/index-[^" ]+\.js'
          curl --fail --silent --show-error "${site}/sw.js?v=${GITHUB_SHA}" | grep -Eq 'route-switcher-v[0-9]+'
          maps="$(curl --fail --silent --show-error "${site}/map-packs/private/catalog.json?v=${GITHUB_SHA}" | jq '.maps | length')"
          test "${maps}" -ge 52
          curl --fail --silent --show-error \
            -o /tmp/wuwa-map-tile.webp \
            "${site}/map-packs/private/maps/912/5_-5.webp?v=${GITHUB_SHA}"
          test "$(stat -c '%s' /tmp/wuwa-map-tile.webp)" -gt 0
